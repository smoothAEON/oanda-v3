[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-signal-mcp"
version = "0.1.0"
description = "Local read-only OANDA market-analysis MCP stdio server."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Market Signal MCP" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
market-signal-mcp = "mcp_server.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent",
  "agent.*",
  "config",
  "config.*",
  "core",
  "core.*",
  "providers",
  "providers.*",
  "smc",
  "smc.*",
  "indicators",
  "indicators.*",
  "filters",
  "filters.*",
  "data",
  "data.*",
  "journal",
  "journal.*",
  "tracking",
  "tracking.*",
  "background",
  "background.*",
  "charting",
  "charting.*",
  "orchestration",
  "orchestration.*",
  "mcp_server",
  "mcp_server.*",
]

[tool.pytest.ini_options]
addopts = "-ra"
python_files = ["test_*.py"]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
markers = [
  "live: tests that hit the real OANDA API (run with: pytest tests/live/ -m live)",
  "timeout: per-test timeout in seconds (requires pytest-timeout for enforcement)",
]
